<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
        }

        header {
            background: #111;
            color: white;
            padding: 30px;
        }

        main {
            padding: 50px 20px;
        }

        h1 {
            font-size: 35px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #mensagem {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🚀 Meu Primeiro Site</h1>
        <p>Hospedado gratuitamente pelo GitHub Pages!</p>
    </header>

    <main>
        <h2>Teste do GitHub</h2>

        <p>Se você está vendo isso na internet, funcionou! 🎉</p>

        <button onclick="mostrarMensagem()">
            Clique aqui
        </button>

        <div id="mensagem"></div>
    </main>

    <script>
        function mostrarMensagem() {
            document.getElementById("mensagem").innerHTML =
                "🔥 FUNCIONOU! Seu site está online!";
        }
    </script>

</body>
</html>
